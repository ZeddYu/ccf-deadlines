<!DOCTYPE html>
<html>

<head>
  <script>
    (() => {
      const stored = localStorage.getItem('theme');
      const preference = stored === 'light' || stored === 'dark' || stored === 'system'
        ? stored
        : 'system';
      const media = window.matchMedia('(prefers-color-scheme: dark)');
      const resolved = preference === 'system'
        ? (media.matches ? 'dark' : 'light')
        : preference;
      document.documentElement.setAttribute('data-theme', resolved);
    })();
  </script>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-RY374M6FJ8"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-RY374M6FJ8');
  </script>

  <!-- Add a plain CSS file: see https://trunkrs.dev/assets/#css -->
  <!-- If using Tailwind with Leptos CSR, see https://trunkrs.dev/assets/#tailwind instead-->
  <link data-trunk rel="css" href="public/styles.css" />

  <!-- Include favicon in dist output: see https://trunkrs.dev/assets/#icon -->
  <link data-trunk rel="icon" href="public/favicon.ico" />

  <!-- include support for `wasm-bindgen --weak-refs` - see: https://rustwasm.github.io/docs/wasm-bindgen/reference/weak-references.html -->
  <link data-trunk rel="rust" data-wasm-opt="z" data-weak-refs />

  <link rel="alternate" type="application/rss+xml" title="CCF Conference Deadlines (RSS)" href="https://ccfddl.com/conference/deadlines_en.xml" />

  <link data-trunk rel="copy-dir" href="public/conference">
</head>


<body>
  <div id="loading">
    <div class="loading-spinner"></div>
    <div class="loading-text">Loading CCF Deadlines...</div>
  </div>
  <style>
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--color-bg, #ffffff);
      z-index: 9999;
      transition: opacity 0.3s ease-out;
    }
    #loading.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid var(--color-border, #e5e7eb);
      border-top-color: var(--color-primary, #3b82f6);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    .loading-text {
      margin-top: 16px;
      font-size: 16px;
      color: var(--color-text-secondary, #6b7280);
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-color-scheme: dark) {
      #loading {
        background: var(--color-bg, #1f2937);
      }
      .loading-text {
        color: var(--color-text-secondary, #9ca3af);
      }
    }
  </style>
  <script>
    window.addEventListener('load', function() {
      var loading = document.getElementById('loading');
      if (loading) {
        loading.classList.add('fade-out');
        setTimeout(function() {
          loading.remove();
        }, 300);
      }
    });
  </script>
</body>

</html>
